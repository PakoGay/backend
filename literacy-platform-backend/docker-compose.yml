services:
  postgres:
    image: postgres:17
    container_name: literacy-postgres
    environment:
      POSTGRES_DB: literacy_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 2005
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d literacy_db"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data

  app:
    build: .
    container_name: literacy-api
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/literacy_db
      DB_USERNAME: postgres
      DB_PASSWORD: 2005
      JWT_SECRET: local_compose_secret_please_change_32_chars_minimum
      CORS_ALLOWED_ORIGINS: http://localhost:5173,http://localhost:3000
      SERVER_PORT: 8080
      SPRING_PROFILES_ACTIVE: local
    ports:
      - "8080:8080"

volumes:
  postgres_data: