spring:
  datasource:
    url: jdbc:h2:mem:literacydb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    database-platform: org.hibernate.dialect.H2Dialect
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  h2:
    console:
      enabled: true
      path: /h2-console

app:
  security:
    jwt-secret: 01234567890123456789012345678901
    access-token-minutes: 15
    refresh-token-days: 7

  cors:
    allowed-origins: http://localhost:5173