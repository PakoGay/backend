name: Java CI with Maven

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: testdb
          POSTGRES_USER: user
          POSTGRES_PASSWORD: password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build and Run Tests
        # Твоя папка проекта
        working-directory: literacy-platform-backend
        run: mvn clean verify
        env:
          # ПРИНУДИТЕЛЬНО исправляем настройки из твоего YAML на работу с Postgres
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/testdb
          SPRING_DATASOURCE_USERNAME: user
          SPRING_DATASOURCE_PASSWORD: password
          SPRING_DATASOURCE_DRIVER_CLASS_NAME: org.postgresql.Driver
          SPRING_JPA_DATABASE_PLATFORM: org.hibernate.dialect.PostgreSQLDialect
          # Берем секрет из GitHub Settings
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          # Используем секрет или стандартный ключ, если в коде напарника другое имя
          APP_SECURITY_JWT_SECRET: ${{ secrets.JWT_SECRET }}
          SPRING_PROFILES_ACTIVE: test

