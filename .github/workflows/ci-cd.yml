name: CI Pipeline

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    name: Build & Test (Java 21)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: literacy_test
          POSTGRES_USER: testuser
          POSTGRES_PASSWORD: testpassword
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/literacy_test
      SPRING_DATASOURCE_USERNAME: testuser
      SPRING_DATASOURCE_PASSWORD: testpassword
      SPRING_PROFILES_ACTIVE: test
      JWT_SECRET: ${{ secrets.JWT_SECRET }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Run Checkstyle
        working-directory: literacy-platform-backend
        run: mvn checkstyle:check --no-transfer-progress

      - name: Run tests with coverage
        working-directory: literacy-platform-backend
        run: mvn verify --no-transfer-progress -Pcoverage

      - name: Check coverage threshold
        working-directory: literacy-platform-backend
        run: |
          COVERAGE=$(mvn jacoco:report -q --no-transfer-progress && \
            grep -Po 'INSTRUCTION.*?<counter type="INSTRUCTION"[^/]*/>' \
            target/site/jacoco/jacoco.xml | \
            python3 -c "
          import sys, re
          data = sys.stdin.read()
          missed = sum(int(x) for x in re.findall(r'missed=\"(\d+)\"', data))
          covered = sum(int(x) for x in re.findall(r'covered=\"(\d+)\"', data))
          total = missed + covered
          pct = (covered / total * 100) if total else 0
          print(f'{pct:.1f}')
          " 2>/dev/null || echo "0")
          echo "Coverage: ${COVERAGE}%"
          python3 -c "
          c = float('${COVERAGE}')
          if c < 60:
              raise SystemExit(f'Coverage {c:.1f}% is below required 60%')
          print(f'✅ Coverage {c:.1f}% meets the 60% requirement')
          "

      - name: Upload JaCoCo coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jacoco-report
          path: literacy-platform-backend/target/site/jacoco/
          retention-days: 7

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: literacy-platform-backend/target/surefire-reports/
          retention-days: 7

  docker-build:
    name: Docker Build Check
    runs-on: ubuntu-latest
    needs: build-and-test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image (no push)
        uses: docker/build-push-action@v5
        with:
          context: ./literacy-platform-backend
          push: false
          tags: literacy-backend:ci-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [ build-and-test, docker-build ]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build production JAR
        working-directory: literacy-platform-backend
        run: mvn package -DskipTests --no-transfer-progress

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./literacy-platform-backend
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/literacy-backend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/literacy-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            cd /opt/literacy-platform
            docker compose pull backend
            docker compose up -d --no-deps backend
            docker image prune -f
            echo "✅ Deployed literacy-backend:${{ github.sha }}"
